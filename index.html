<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Strength Checker</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <link rel="stylesheet" href="style.css">
</head>

<body class="light d-flex justify-content-center align-items-center">

    <div class="card p-4 shadow-lg password-card">

        <!-- Theme Toggle -->
        <div class="text-end mb-2">
            <button id="themeToggle" class="theme-toggle">
                🌙 
            </button>
        </div>

        <h3 class="text-center mb-3">Password Checker!</h3>

        <!-- Password Input with Eye Icon -->
        <div class="input-group mb-2">
            <input type="password" id="password" class="form-control" placeholder="Enter Password">
            <button class="btn btn-outline-secondary" id="togglePassword">
                <i class="bi bi-eye"></i>
            </button>
        </div>

        <!-- Strength Text -->
        <div id="strength" class="fw-bold mb-2"></div>

        <!-- Progress Bar -->
        <div class="progress mb-3">
            <div id="progressBar" class="progress-bar" role="progressbar"></div>
        </div>

        <!-- Conditions -->
        <ul class="list-unstyled small">
            <li id="length">Atleast 8 characters</li>
            <li id="uppercase">One uppercase letter</li>
            <li id="lowercase">One lowercase letter</li>
            <li id="number">One number</li>
            <li id="special">One special character</li>
        </ul>

    </div>

<script src="script.js"></script>
</body>
</html>
